<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Club 🍁 — KOMs &amp; Top10s</title>
<style>
  :root {
    --laranja: #c75b12;
    --grelha: #3c4043;
    --fundo: #1b1b1d;
    --painel: #242528;
    --texto: #e8eaed;
    --suave: #9aa0a6;
    --link: #8ab4f8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Roboto, "Segoe UI", Arial, sans-serif;
    margin: 0; padding: 16px;
    background: var(--fundo); color: var(--texto);
    font-size: 14px;
    color-scheme: dark;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h1 small { font-weight: normal; color: var(--suave); font-size: 12px; }

  table { border-collapse: collapse; background: var(--painel); }
  th, td { border: 1px solid var(--grelha); padding: 4px 10px; text-align: center; }
  thead th { background: var(--laranja); color: #fff; font-weight: 700; }

  td.atleta { color: #fff; font-weight: 700; }

  #ranking { margin-bottom: 20px; }
  #ranking td.num { text-align: center; }
  #ranking tr.r0 td:not(:first-child) { background: #4a3a12; }
  #ranking td { font-weight: 600; }

  .filtros { margin: 0 0 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filtros select, .filtros input {
    padding: 5px 8px; border: 1px solid var(--grelha); border-radius: 4px;
    font-size: 13px; background: var(--painel); color: var(--texto);
  }
  .filtros input { width: 220px; }
  #conta { color: var(--suave); font-size: 12px; }

  #tabela th { cursor: pointer; user-select: none; white-space: nowrap; }
  #tabela th .seta { font-size: 10px; }
  #tabela td.seg { text-align: left; }
  a { color: var(--link); }
  #tabela tbody tr:nth-child(even) { background: #2a2622; }
  td.num, th.num { text-align: right; }
  .trofeu { font-size: 15px; }
</style>
</head>
<body>
<h1>Club 🍁 — KOMs &amp; Top10s <small id="gerado"></small></h1>

<table id="ranking">
  <thead><tr>
    <th>Nome</th><th>👑</th><th>🏆</th><th>Pontos</th><th>Posição Média</th>
  </tr></thead>
  <tbody></tbody>
</table>

<div class="filtros">
  <select id="f-atleta"><option value="">Todos os atletas</option></select>
  <select id="f-tipo"><option value="">Todos os tipos</option></select>
  <select id="f-pais"><option value="">Todos os países</option></select>
  <select id="f-cidade"><option value="">Todas as cidades</option></select>
  <select id="f-trofeu">
    <option value="">👑 + 🏆</option>
    <option value="kom">Só 👑 (1º)</option>
    <option value="top">Só 🏆 (2–10)</option>
  </select>
  <input id="f-busca" type="search" placeholder="Procurar segmento…">
  <span id="conta"></span>
</div>

<table id="tabela">
  <thead><tr>
    <th data-k="atleta">Nome <span class="seta"></span></th>
    <th data-k="posicao">Posição <span class="seta"></span></th>
    <th>Troféu</th>
    <th data-k="tipo">Tipo <span class="seta"></span></th>
    <th data-k="segmento">Segmento <span class="seta"></span></th>
    <th data-k="dist_km" class="num">Distância <span class="seta"></span></th>
    <th data-k="elev_gain" class="num">Ganho <span class="seta"></span></th>
    <th data-k="avg_grade" class="num">Declive <span class="seta"></span></th>
    <th data-k="vel_kmh" class="num">Ritmo <span class="seta"></span></th>
    <th data-k="tempo">Tempo <span class="seta"></span></th>
    <th data-k="cidade">Cidade <span class="seta"></span></th>
    <th data-k="pais">País <span class="seta"></span></th>
    <th data-k="data">Data <span class="seta"></span></th>
  </tr></thead>
  <tbody></tbody>
</table>

<script>
"use strict";
let linhas = [];
let ordem = { k: "data", asc: false };

function escHtml(s) {
  return String(s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// cores fixas da sheet (ajustadas p/ dark) + paleta para o resto do clube
const CORES_FIXAS = { "Xeira": "#8e24aa", "Zé": "#c62828",
                      "Carolina": "#b8a000", "Ana": "#00838f" };
const PALETA = ["#2e7d32", "#1565c0", "#e65100", "#5d4037",
                "#37474f", "#6a1b9a", "#00695c", "#9e9d24"];
function corAtleta(n) {
  if (CORES_FIXAS[n]) return CORES_FIXAS[n];
  let h = 0;                       // hash determinístico: cor estável entre dias
  for (const c of n) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return PALETA[h % PALETA.length];
}
function trofeu(p) { return p === 1 ? "👑" : "🏆"; }
const TIPOS = { "Run": "🏃🏻‍♂️", "Ride": "🚲", "Walk": "🚶‍♂️" };
function emojiTipo(t) { return TIPOS[t] ?? t; }
function dataPt(iso) {
  const [a, m, d] = iso.split("-");
  return `${d}/${m}/${a}`;
}

// "tempo" vem normalizado do scraper como "M:SS" ou "H:MM:SS";
// aceita também o formato antigo "Ns" por segurança em dados não migrados.
function tempoSegundos(t) {
  if (t.endsWith("s") && !t.includes(":")) return parseInt(t, 10);
  const p = t.split(":").map(Number);
  while (p.length < 3) p.unshift(0);
  const [h, m, s] = p;
  return h * 3600 + m * 60 + s;
}
function velKmh(l) {
  const seg = tempoSegundos(l.tempo);
  return seg > 0 && l.dist_km > 0 ? l.dist_km / (seg / 3600) : 0;
}
// Ride mostra-se em km/h; Run/Walk mostra-se em ritmo min:seg por km.
function formatarRitmo(l) {
  if (!l.vel_kmh) return "—";
  const segKm = 3600 / l.vel_kmh;
  const m = Math.floor(segKm / 60), s = Math.round(segKm % 60);
  return `${m}:${String(s).padStart(2, "0")} /km`;
}

function ranking() {
  const por = {};
  for (const l of linhas) {
    const r = por[l.atleta] ??= { nome: l.atleta, koms: 0, meds: 0, pontos: 0, soma: 0, n: 0 };
    if (l.posicao === 1) r.koms++; else r.meds++;
    r.pontos += 11 - l.posicao;       // 👑=10 … 10º=1
    r.soma += l.posicao; r.n++;
  }
  const ord = Object.values(por).sort((a, b) => b.pontos - a.pontos);
  document.querySelector("#ranking tbody").innerHTML = ord.map((r, i) => `
    <tr class="r${i}">
      <td class="atleta" style="background:${corAtleta(r.nome)}">${escHtml(r.nome)}</td>
      <td class="num">${r.koms}</td><td class="num">${r.meds}</td>
      <td class="num">${r.pontos}</td>
      <td class="num">${(r.soma / r.n).toFixed(3)}</td>
    </tr>`).join("");
}

function filtradas() {
  const fa = document.getElementById("f-atleta").value;
  const ft = document.getElementById("f-tipo").value;
  const fp = document.getElementById("f-pais").value;
  const fc = document.getElementById("f-cidade").value;
  const fr = document.getElementById("f-trofeu").value;
  const q = document.getElementById("f-busca").value.toLowerCase();
  return linhas.filter(l =>
    (!fa || l.atleta === fa) &&
    (!ft || l.tipo === ft) &&
    (!fp || l.pais === fp) &&
    (!fc || l.cidade === fc) &&
    (!fr || (fr === "kom" ? l.posicao === 1 : l.posicao > 1)) &&
    (!q || l.segmento.toLowerCase().includes(q)));
}

function render() {
  const ls = filtradas().slice().sort((a, b) => {
    const va = a[ordem.k], vb = b[ordem.k];
    const c = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "pt");
    return ordem.asc ? c : -c;
  });
  document.querySelector("#tabela tbody").innerHTML = ls.map(l => `
    <tr>
      <td class="atleta" style="background:${corAtleta(l.atleta)}">${escHtml(l.atleta)}</td>
      <td>${l.posicao}</td>
      <td class="trofeu">${trofeu(l.posicao)}</td>
      <td>${emojiTipo(l.tipo)}</td>
      <td class="seg"><a href="${escHtml(l.url)}" target="_blank" rel="noopener">${escHtml(l.segmento)}</a></td>
      <td class="num">${l.dist_km.toFixed(2)} km</td>
      <td class="num">${l.elev_gain != null ? l.elev_gain + " m" : "—"}</td>
      <td class="num">${l.avg_grade != null ? l.avg_grade + " %" : "—"}</td>
      <td class="num">${formatarRitmo(l)}</td>
      <td>${l.effort_url
        ? `<a href="${escHtml(l.effort_url)}" target="_blank" rel="noopener">${escHtml(l.tempo)}</a>`
        : escHtml(l.tempo)}</td>
      <td>${escHtml(l.cidade || "—")}</td>
      <td>${escHtml(l.pais || "—")}</td>
      <td>${dataPt(l.data)}</td>
    </tr>`).join("");
  document.getElementById("conta").textContent = `${ls.length} de ${linhas.length}`;
  document.querySelectorAll("#tabela th[data-k]").forEach(th => {
    th.querySelector(".seta").textContent =
      th.dataset.k === ordem.k ? (ordem.asc ? "▲" : "▼") : "";
  });
}

function popularFiltros() {
  const op = (sel, vals) => {
    const s = document.getElementById(sel);
    for (const v of vals) s.insertAdjacentHTML("beforeend",
      `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  };
  op("f-atleta", [...new Set(linhas.map(l => l.atleta))].sort());
  op("f-pais", [...new Set(linhas.map(l => l.pais).filter(Boolean))].sort());
  op("f-cidade", [...new Set(linhas.map(l => l.cidade).filter(Boolean))].sort());
  const st = document.getElementById("f-tipo");
  for (const v of [...new Set(linhas.map(l => l.tipo))].sort())
    st.insertAdjacentHTML("beforeend",
      `<option value="${escHtml(v)}">${emojiTipo(v)}</option>`);
}

document.querySelectorAll("#tabela th[data-k]").forEach(th =>
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    ordem = { k, asc: ordem.k === k ? !ordem.asc : true };
    render();
  }));
document.querySelectorAll(".filtros select, .filtros input").forEach(el =>
  el.addEventListener("input", render));

fetch("data.json").then(r => r.json()).then(d => {
  linhas = d.linhas;
  for (const l of linhas) l.vel_kmh = velKmh(l);
  // gerado vem em UTC ("...Z"); mostrar em hora local pt-PT
  document.getElementById("gerado").textContent =
    "actualizado " + new Date(d.gerado).toLocaleString("pt-PT",
      { day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit" });
  popularFiltros();
  ranking();
  render();
});
</script>
</body>
</html>
