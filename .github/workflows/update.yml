name: actualizar dados

on:
  schedule:
    - cron: "30 5 * * *"   # diário às 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: scrape Strava (KOMs/Top10s)
        env:
          STRAVA_SESSION: ${{ secrets.STRAVA_SESSION }}
        run: python scrape.py
      - name: scrape Strava (Best Efforts / PRs)
        env:
          STRAVA_SESSION: ${{ secrets.STRAVA_SESSION }}
        run: python scrape_prs.py
      - name: commit se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json localizacoes.json prs.json flagged.json
          # só o "gerado" mudou = nada de novo
          if ! git diff --cached --quiet -I '"gerado"'; then
            git commit -m "chore(data): dados $(date -u +%F)"
            git push
          else
            echo "sem alterações"
          fi
