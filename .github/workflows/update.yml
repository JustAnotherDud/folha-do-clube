name: actualizar dados

on:
  schedule:
    - cron: "30 5 * * *"   # diário às 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: scrape Strava
        env:
          STRAVA_SESSION: ${{ secrets.STRAVA_SESSION }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scrape.py
      - name: commit se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json localizacoes.json segmentos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: dados $(date -u +%F)"
            git push
          else
            echo "sem alterações"
          fi
